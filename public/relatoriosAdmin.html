<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/relatorios.css">
    <link rel="stylesheet" href="css/navbarAdmin.css">
    <link rel="stylesheet" href="css/solicitacoesRelatorio.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Gerenciar Relatórios</title>
</head>

<body>

    <div class="container_navbar">
        <div class="container_top">
            <div class="img_logo">
                <img src="./images/prevcrimeLogo.svg" alt="">
            </div>
            <nav class="navbar_buttons">
                <a href="filtros.html" class="nav_item">
                    <i class='bx bx-filter-alt'></i>
                    <span>Filtros</span>
                </a>
                <a href="relatoriosAdmin.html" class="nav_item active">
                    <i class='bx bxs-report'></i>
                    <span>Relatórios</span>
                </a>
            </nav>
        </div>

        <div class="container_bottom">
            <div class="card_usuario">
                <div class="user_icon">
                    <i class='bx bx-user'></i>
                </div>
                <div class="user_info">
                    <span class="perfil">Admin</span>
                    <span id="nome" class="nome">Guilherme</span>
                </div>
                <div id="open" class="notificacao">
                    <i class='bx bx-bell'></i>
                </div>
            </div>
            <p class="copyright">©2025 PrevCrime, Inc.</p>
        </div>
    </div>

    <div class="container_conteudo">
        <div class="conteudo">

            <h2 class="titulo_pagina">Relatórios</h2>

            <div class="cards_info">
                <div class="card_info">
                    <div class="coluna"></div>
                    <span class="card_titulo">Total de Relatórios</span>
                    <span id="total_relatorios" class="card_valor"></span>
                </div>

                <div class="card_info">
                    <div class="coluna"></div>
                    <span class="card_titulo">Relatórios Reprovados</span>
                    <span id="relatorios_reprovados" class="card_valor"></span>
                </div>
            </div>

            <div class="container_tabela">
                <div class="tabela_header">
                    <div>ID</div>
                    <div>Nome</div>
                    <div>Solicitante</div>
                    <div>Status</div>
                    <div>Agência</div>
                    <div>Funções</div>
                </div>

                <div id="container_relatorios" class="container_usuarios"></div>
            </div>

        </div>
    </div>

    <dialog id="modal">
        <div class="container">
            <div class="container_forms">
                <div class="forms">
                    <a class="setaVoltar" id="close">
                        <img src="./images/setaVoltar.png" alt="Voltar" class="seta_svg">
                        Fechar
                    </a>
                    <p class="title">Solicitações de Relatórios</p>
                    <div class="container_solicitacoes" id="solicitacoes_container"></div>
                </div>
            </div>
        </div>
    </dialog>

</body>

</html>

<script>

    const modal = document.querySelector("dialog");
    document.getElementById("open").onclick = () => modal.showModal();
    document.getElementById("close").onclick = () => modal.close();

    fetch("/relatorios/listar", {
        method: "GET"
    }).then(res => {
        if (!res.ok) return;

        res.json().then(json => {
            document.getElementById("total_relatorios").innerHTML = json.length;
            document.getElementById("relatorios_reprovados").innerHTML =
                json.filter(item => item.status == "Reprovado").length;

            for (let i = 0; i < json.length; i++) {
                const r = json[i];

                document.getElementById("container_relatorios").innerHTML += `
                    <div class="tabela_row">
                        <span class="col">${r.id}</span>

                        <input class="col" type="text" value="${r.nome}" disabled>
                        <input class="col" type="text" value="${r.solicitante}" disabled>
                        <input class="col" type="text" value="${r.status}" disabled>
                        <input class="col" type="text" value="${r.agencia}" disabled>

                        <div class="funcoes">
                            <button class="btn_verde editar"><i class="bx bx-edit-alt"></i></button>
                            <button class="btn_vermelho cancelar"><i class="bx bx-trash"></i></button>
                        </div>
                    </div>
                `;
            }
        });
    });

    document.getElementById("container_relatorios").addEventListener("click", function (event) {

        const btn = event.target.closest(".editar");
        if (!btn) return;

        const row = btn.closest(".tabela_row");
        const inputs = row.querySelectorAll("input");
        const disabled = inputs[0].disabled;
        const idRelatorio = row.querySelector("span").innerHTML;

        if (disabled) {
            inputs.forEach(input => input.disabled = false);
            btn.innerHTML = `<i class='bx bx-x'></i>`;
        } else {
            inputs.forEach(input => input.disabled = true);
            btn.innerHTML = `<i class='bx bx-edit-alt'></i>`;

            const atualizado = {
                titulo_relatorio: inputs[0].value
            };

            fetch(`/relatorios/editar/${idRelatorio}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(atualizado)
            });
        }
    });

    document.getElementById("container_relatorios").addEventListener("click", function (event) {

        const btn = event.target.closest(".cancelar");
        if (!btn) return;

        const row = btn.closest(".tabela_row");
        const inputs = row.querySelectorAll("input");
        const statusInput = inputs[2];

        if (statusInput.value == "Ativo") {
            statusInput.value = "Desativado";
        } else {
            statusInput.value = "Ativo";
        }

        const id = row.querySelector("span").innerHTML;

        fetch(`/relatorios/status/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                status: statusInput.value
            })
        });
    });

</script>
