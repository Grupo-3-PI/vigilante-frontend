<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/filtros.css">
    <link rel="stylesheet" href="css/navbarAdmin.css">
    <link rel="stylesheet" href="css/cadastrarFiltro.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Gerenciar Filtros</title>
</head>

<body>

    <!-- Navbar -->
    <div class="container_navbar">
        <div class="container_top">
            <div class="img_logo">
                <img src="./images/prevcrimeLogo.svg" alt="">
            </div>

            <nav class="navbar_buttons">
                <a href="filtros.html" class="nav_item" style="color: #83a2ff;">
                    <i class='bx bx-filter-alt'></i>
                    <span>Filtros</span>
                </a>

                <a href="relatoriosAdmin.html" class="nav_item">
                    <i class='bx bxs-report'></i>
                    <span>Relatórios</span>
                </a>
            </nav>
        </div>

        <div class="container_bottom">
            <div class="card_usuario" onclick="window.location.href='perfil.html'">
                <div class="user_icon">
                    <i class='bx bx-user'></i>
                </div>
                <div class="user_info">
                    <span class="perfil">Admin</span>
                    <span id="nome" class="nome">Usuário</span>
                </div>
                <div class="notificacao">
                    <i class='bx bx-bell'></i>
                </div>
            </div>

            <p class="copyright">©2025 PrevCrime, Inc.</p>
        </div>
    </div>

    <div class="container_conteudo">
        <div class="conteudo">
            <h2 class="titulo_pagina">Filtros</h2>

            <div class="cards_info">
                <div class="card_info">
                    <div class="coluna"></div>
                    <span class="card_titulo">Total de Filtros</span>
                    <span id="total_filtros" class="card_valor"></span>
                </div>

                <div class="card_info">
                    <div class="coluna"></div>
                    <span class="card_titulo">Filtros Desativados</span>
                    <span class="card_valor">4</span>
                </div>

                <div id="open">Adicionar Filtro <i class='bx bxs-file-plus'></i></div>
            </div>

            <div class="container_tabela">
                <div class="tabela_header">
                    <div>ID</div>
                    <div>Nome</div>
                    <div>Descrição</div>
                    <div>Categoria</div>
                    <div>Status</div>
                    <div>Funções</div>
                </div>

                <div id="container_filtros" class="container_filtros">
                </div>
            </div>

        </div>
    </div>

    <dialog id="modal">
        <div class="container">
            <div class="container_forms">
                <div class="forms">
                    <a class="setaVoltar" id="close">
                        <img src="./images/setaVoltar.png" alt="Voltar" class="seta_svg">
                        Fechar
                    </a>

                    <p class="title">Filtro</p>

                    <div class="container_inputs">
                        <input type="text" id="nome_value" placeholder="Nome" class="inputs required">
                        <span class="erro">Filtro deve ter 3 caracteres</span>

                        <input type="text" id="descricao_value" placeholder="Descrição" class="inputs required">

                        <select name="Categoria" id="categoria_filtro">
                            <option value="">Selecione uma Categoria</option>
                            <option value="Furto">Crime: Furto</option>
                            <option value="Roubo">Crime: Roubo</option>
                            <option value="Assédio">Crime: Assédio</option>
                        </select>
                    </div>

                    <div class="container_button">
                        <button id="botao" onclick="cadastrar()">Adicionar Filtro</button>
                    </div>

                </div>
            </div>
        </div>
    </dialog>

</body>

</html>

<script>
    let nomeAdmin = sessionStorage.getItem('ADMIN_NOME');
    let nome = document.getElementById("nome");
    nome.innerHTML = nomeAdmin;

    const modal = document.querySelector('dialog');
    document.getElementById("open").onclick = () => modal.showModal();
    document.getElementById("close").onclick = () => modal.close();

    fetch("/filtros/listarTodos")
        .then(res => res.json())
        .then(json => {
            document.getElementById("total_filtros").innerHTML = json.length;

            let container = document.getElementById("container_filtros");

            json.forEach(filtro => {

                let iconeStatus = "";
                if (filtro.status == "Ativo") {
                    iconeStatus = "<i class='bx bxs-lock' style='color:#ffffff'></i>";
                } else {
                    iconeStatus = "<i class='bx bxs-lock-open' style='color:#ffffff'></i>";
                }

                container.innerHTML += `
                    <div class="tabela_row">
                        <span class="col">${filtro.id}</span>

                        <input class="col" type="text" value="${filtro.nome}" disabled>
                        <input class="col" type="text" value="${filtro.descricao}" disabled>
                        <input class="col" type="text" value="${filtro.categoria}" disabled>
                        <input class="col" type="text" value="${filtro.status}" disabled>

                        <div class="funcoes">
                            <button class="btn_verde editar">
                                <i class="bx bx-edit-alt"></i>
                            </button>

                            <button class="btn_vermelho cancelar">
                                ${iconeStatus}
                            </button>
                        </div>
                    </div>`;
            });
        });

    document.getElementById("container_filtros").addEventListener("click", function (event) {
        const btn = event.target.closest(".editar");
        if (!btn) return;

        const row = btn.closest(".tabela_row");
        const inputs = row.querySelectorAll("input");

        const desabilitado = inputs[0].disabled;

        if (desabilitado) {
            inputs.forEach(input => input.disabled = false);
            btn.innerHTML = "<i class='bx bx-x'></i>";
        } else {
            inputs.forEach(input => input.disabled = true);
            btn.innerHTML = "<i class='bx bx-edit-alt'></i>";

            fetch(`/filtros/editar/${row.querySelector("span").innerHTML}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nomeServer: inputs[0].value,
                    descricaoServer: inputs[1].value,
                    categoriaServer: inputs[2].value,
                    statusServer: inputs[3].value
                })
            });
        }
    });

    document.getElementById("container_filtros").addEventListener("click", function (event) {
        const btn = event.target.closest(".cancelar");
        if (!btn) return;

        const row = btn.closest(".tabela_row");
        const inputs = row.querySelectorAll("input");
        const statusInput = inputs[3];

        if (statusInput.value == "Ativo") {
            statusInput.value = "Desativado";
            btn.innerHTML = "<i class='bx bxs-lock-open' style='color:#ffffff'></i>";
        } else {
            statusInput.value = "Ativo";
            btn.innerHTML = "<i class='bx bxs-lock' style='color:#ffffff'></i>";
        }

        fetch(`/filtros/atualizarStatus/${row.querySelector("span").innerHTML}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: inputs[0].value,
                descricaoServer: inputs[1].value,
                categoriaServer: inputs[2].value,
                statusServer: inputs[3].value
            })
        });
    });
</script>


<script src="js/cadastrarFiltro.js"></script>
